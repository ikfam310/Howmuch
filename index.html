<!-- ============================================================
     CSVパーサ + 数値・真偽・日付ユーティリティ
     ============================================================ -->
<script type="text/babel" data-presets="react">
function parseCSV(text) {
  // BOM除去
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  let i = 0;
  while (i < text.length) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++;
    } else {
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ',') { row.push(field); field = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { row.push(field); field = ''; rows.push(row); row = []; i++; continue; }
      field += c; i++;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function rowsToObjects(rows) {
  if (!rows.length) return [];
  const headers = rows[0].map(h => String(h).trim());
  return rows.slice(1)
    .filter(r => r.some(v => String(v).trim() !== ''))
    .map(r => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = r[i] != null ? r[i] : ''; });
      return obj;
    });
}

function parseNum(s) {
  if (s == null) return 0;
  s = String(s).trim();
  if (!s) return 0;
  let neg = false;
  // 括弧で負数表現
  if ((s.startsWith('(') || s.startsWith('（')) &&
      (s.endsWith(')') || s.endsWith('）'))) {
    neg = true; s = s.slice(1, -1);
  }
  // 通貨記号・カンマ・空白を除去
  s = s.replace(/[¥￥,円\s]/g, '');
  // 先頭マイナス（半角・全角・ダッシュ各種）
  if (/^[−–—\-‐]/.test(s)) { neg = !neg; s = s.slice(1); }
  if (s === '' || s === '-') return 0;
  const n = parseFloat(s);
  if (Number.isNaN(n)) return 0;
  return neg ? -n : n;
}

function parseBool(s) {
  if (s == null) return false;
  const v = String(s).trim().toLowerCase();
  if (!v) return false;
  if (['0', 'false', 'no', 'n', '×', 'x', 'ｘ', '-', '−', 'なし'].includes(v)) return false;
  return true;
}

function fmtYen(n) {
  if (n == null || Number.isNaN(n)) return '—';
  const r = Math.round(n);
  const abs = Math.abs(r).toLocaleString('en-US');
  return (r < 0 ? '−¥' : '¥') + abs;
}

function pct(used, total) {
  if (!total || total <= 0) return 0;
  const p = Math.round((used / total) * 100);
  return Math.max(0, Math.min(999, p));
}

// 月曜始まりで、今月にかかる週の数（部分週も1週とカウント）
function weeksInMonth(year, month1to12) {
  const first = new Date(year, month1to12 - 1, 1);
  const last = new Date(year, month1to12, 0);
  const firstDow = (first.getDay() + 6) % 7; // 0=Mon
  const startMon = new Date(first.getFullYear(), first.getMonth(), first.getDate() - firstDow);
  let weeks = 0;
  for (let d = new Date(startMon); d <= last; d.setDate(d.getDate() + 7)) weeks++;
  return weeks || 1;
}

function todayInfo() {
  const t = new Date();
  const y = t.getFullYear();
  const m = t.getMonth() + 1;
  const d = t.getDate();
  const dow = ['日','月','火','水','木','金','土'][t.getDay()];
  return {
    date: t,
    year: y, month: m, day: d,
    label: `${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')} ${dow}`,
    monthLabel: `${y}年${m}月`,
    daysInMonth: new Date(y, m, 0).getDate(),
    monthDaysLeft: Math.max(0, new Date(y, m, 0).getDate() - d),
    weeksInMonth: weeksInMonth(y, m),
  };
}

window.HM = window.HM || {};
Object.assign(window.HM, {
  parseCSV, rowsToObjects, parseNum, parseBool,
  fmtYen, pct, weeksInMonth, todayInfo,
});
</script>

<!-- ============================================================
     データロード + 正規化
     ============================================================ -->
<script type="text/babel" data-presets="react">
const REQUIRED_HEADERS = [
  'budget_key', '費目', '詳細',
  '週', '月', '年', 'シーズン夏', 'シーズン冬',
  '年予算', '月予算', 'シーズン夏予算', 'シーズン冬予算',
  '年実績', 'シーズン夏実績', 'シーズン冬実績',
  '年残り', 'シーズン夏残り', 'シーズン冬残り',
];
const MONTH_ACTUAL_HEADERS = Array.from({length: 12}, (_, i) => `${i+1}月実績`);

function normalizeRow(o) {
  const { parseNum, parseBool } = window.HM;
  const monthly = MONTH_ACTUAL_HEADERS.map(h => parseNum(o[h]));
  return {
    key: String(o['budget_key'] || '').trim(),
    category: String(o['費目'] || '').trim(),
    name: String(o['詳細'] || '').trim() || String(o['費目'] || '').trim(),
    cycles: {
      week:   parseBool(o['週']),
      month:  parseBool(o['月']),
      year:   parseBool(o['年']),
      summer: parseBool(o['シーズン夏']),
      winter: parseBool(o['シーズン冬']),
    },
    budget: {
      year:   parseNum(o['年予算']),
      month:  parseNum(o['月予算']),
      summer: parseNum(o['シーズン夏予算']),
      winter: parseNum(o['シーズン冬予算']),
    },
    actual: {
      year:   parseNum(o['年実績']),
      summer: parseNum(o['シーズン夏実績']),
      winter: parseNum(o['シーズン冬実績']),
    },
    remain: {
      year:   parseNum(o['年残り']),
      summer: parseNum(o['シーズン夏残り']),
      winter: parseNum(o['シーズン冬残り']),
    },
    // 1月実績〜12月実績（0始まり）
    monthly,
    // 週次実績は将来用にプレースホルダー（現在は読み込み列なし）
    weekly: null,
    raw: o,
  };
}

async function loadSheet() {
  const url = window.CSV_URL + '&_=' + Date.now(); // キャッシュ回避
  const res = await fetch(url, { credentials: 'omit' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  if (!text || /<html/i.test(text.slice(0, 200))) {
    throw new Error('CSVではなくHTMLが返されました（共有設定をご確認ください）');
  }
  const grid = window.HM.parseCSV(text);
  const objects = window.HM.rowsToObjects(grid);
  if (!objects.length) throw new Error('行がありません');
  const headers = grid[0].map(h => String(h).trim());
  const missing = REQUIRED_HEADERS.filter(h => !headers.includes(h));
  if (missing.length > 4) {
    throw new Error('期待するヘッダーが見つかりません: ' + missing.slice(0, 4).join(' / ') + ' …');
  }
  const rows = objects
    .map(normalizeRow)
    .filter(r => r.category && r.name); // 空行除外
  return { rows, headers };
}

window.HM.loadSheet = loadSheet;
</script>

<!-- ============================================================
     セレクタ（ビュー用に整形）
     ============================================================ -->
<script type="text/babel" data-presets="react">
const { fmtYen, pct, todayInfo } = window.HM;

// 費目ごとにアイテムをグループ化
function groupByCategory(rows, predicate) {
  const map = new Map();
  for (const r of rows) {
    if (predicate && !predicate(r)) continue;
    if (!map.has(r.category)) map.set(r.category, []);
    map.get(r.category).push(r);
  }
  return Array.from(map.entries()).map(([category, items]) => ({ category, items }));
}

// 月ビュー：費目ごとに 月予算 / 今月実績 / 月の残り
function buildMonthGroups(rows) {
  const t = todayInfo();
  const mIdx = t.month - 1;
  const groups = groupByCategory(rows, r => r.cycles.month);
  return groups.map(({ category, items }) => {
    let budget = 0, actual = 0;
    const itemRows = items.map(it => {
      const ib = it.budget.month;
      const ia = it.monthly[mIdx] || 0;
      const ir = ib - ia;
      budget += ib; actual += ia;
      return {
        name: it.name,
        budget: ib,
        actual: ia,
        remain: ir,
        rem: fmtYen(ir),
        pct: pct(ia, ib),
        warn: ib > 0 && ia > ib,
      };
    });
    const remain = budget - actual;
    return {
      category, items: itemRows,
      budget, actual, remain,
      total: fmtYen(remain),
      pct: pct(actual, budget),
      warn: budget > 0 && actual > budget,
    };
  });
}

// 週ビュー：費目ごとに今週の目安予算（月予算 ÷ 今月の週数）
function buildWeekGroups(rows) {
  const t = todayInfo();
  const w = t.weeksInMonth;
  const groups = groupByCategory(rows, r => r.cycles.week);
  return groups.map(({ category, items }) => {
    let weekly = 0;
    const itemRows = items.map(it => {
      const target = it.budget.month / w;
      weekly += target;
      // 将来：週次実績が入ったら it.weekly を使う
      const a = it.weekly != null ? it.weekly : null;
      return {
        name: it.name,
        target,
        targetLabel: fmtYen(target),
        actual: a,
        actualLabel: a != null ? fmtYen(a) : null,
        // 将来用 pct
        pct: a != null && it.budget.month > 0 ? pct(a, target) : null,
      };
    });
    return {
      category, items: itemRows,
      weekly, weeklyLabel: fmtYen(weekly),
    };
  });
}

// 年ビュー：費目ごとに 年予算/年実績/年残り
function buildYearGroups(rows) {
  const groups = groupByCategory(rows, r => r.cycles.year);
  return groups.map(({ category, items }) => {
    let budget = 0, actual = 0, remain = 0;
    items.forEach(it => { budget += it.budget.year; actual += it.actual.year; remain += it.remain.year; });
    return {
      category, items,
      budget, actual,
      remain: remain || (budget - actual),
      total: fmtYen(remain || (budget - actual)),
      pct: pct(actual, budget),
    };
  });
}

// シーズン（夏/冬）：cycles.summer/winter で絞って合算
function buildSeasonGroups(rows, season /* 'summer' | 'winter' */) {
  const groups = groupByCategory(rows, r => r.cycles[season]);
  return groups.map(({ category, items }) => {
    let budget = 0, actual = 0, remain = 0;
    items.forEach(it => {
      budget += it.budget[season];
      actual += it.actual[season];
      remain += it.remain[season];
    });
    return {
      category, items,
      budget, actual,
      remain: remain || (budget - actual),
      total: fmtYen(remain || (budget - actual)),
      pct: pct(actual, budget),
    };
  });
}

// 季節を今日から自動判定（夏=4-9月, 冬=10-3月）
function currentSeason() {
  const m = todayInfo().month;
  return (m >= 4 && m <= 9) ? 'summer' : 'winter';
}

// 月の進捗インサイト文を生成
function buildInsight(monthGroups) {
  const t = todayInfo();
  let totalBudget = 0, totalActual = 0;
  monthGroups.forEach(g => { totalBudget += g.budget; totalActual += g.actual; });
  if (totalBudget <= 0) {
    return `${t.monthLabel}のデータを読み込みました（あと${t.monthDaysLeft}日）`;
  }
  const p = pct(totalActual, totalBudget);
  const remain = totalBudget - totalActual;
  return `${t.monthLabel}の進捗 ${p}% · 残り ${fmtYen(remain)} / あと${t.monthDaysLeft}日`;
}

// 品目レンズ用：費目から各サイクルの集計を返す
function buildItemLens(rows, category) {
  const t = todayInfo();
  const mIdx = t.month - 1;
  const items = rows.filter(r => r.category === category);

  const cycles = [];
  if (items.some(r => r.cycles.week)) {
    const list = items.filter(r => r.cycles.week);
    let weekly = 0;
    list.forEach(it => weekly += it.budget.month / t.weeksInMonth);
    cycles.push({
      key: 'week', label: '週',
      rem: fmtYen(weekly), used: '—', budget: fmtYen(list.reduce((s, it) => s + it.budget.month, 0)),
      sub: `今週の目安（月予算 ÷ ${t.weeksInMonth}週）`,
      pctVal: 0,
      list: list.map(it => ({
        name: it.name,
        rem: fmtYen(it.budget.month / t.weeksInMonth),
        pct: 0, warn: false,
      })),
      hideUsed: true,
    });
  }
  if (items.some(r => r.cycles.month)) {
    const list = items.filter(r => r.cycles.month);
    let b = 0, a = 0;
    list.forEach(it => { b += it.budget.month; a += it.monthly[mIdx]; });
    cycles.push({
      key: 'month', label: '月',
      rem: fmtYen(b - a), used: fmtYen(a), budget: fmtYen(b),
      sub: `${t.monthLabel} · あと${t.monthDaysLeft}日`,
      pctVal: pct(a, b),
      list: list.map(it => ({
        name: it.name,
        rem: fmtYen(it.budget.month - it.monthly[mIdx]),
        pct: pct(it.monthly[mIdx], it.budget.month),
        warn: it.budget.month > 0 && it.monthly[mIdx] > it.budget.month,
      })),
    });
  }
  ['summer', 'winter'].forEach(s => {
    if (items.some(r => r.cycles[s])) {
      const list = items.filter(r => r.cycles[s]);
      let b = 0, a = 0;
      list.forEach(it => { b += it.budget[s]; a += it.actual[s]; });
      cycles.push({
        key: s, label: s === 'summer' ? '夏' : '冬',
        rem: fmtYen(b - a), used: fmtYen(a), budget: fmtYen(b),
        sub: `${s === 'summer' ? '夏' : '冬'}シーズン`,
        pctVal: pct(a, b),
        list: list.map(it => ({
          name: it.name,
          rem: fmtYen(it.budget[s] - it.actual[s]),
          pct: pct(it.actual[s], it.budget[s]),
          warn: it.budget[s] > 0 && it.actual[s] > it.budget[s],
        })),
      });
    }
  });
  if (items.some(r => r.cycles.year)) {
    const list = items.filter(r => r.cycles.year);
    let b = 0, a = 0;
    list.forEach(it => { b += it.budget.year; a += it.actual.year; });
    cycles.push({
      key: 'year', label: '年',
      rem: fmtYen(b - a), used: fmtYen(a), budget: fmtYen(b),
      sub: `${t.year}年`,
      pctVal: pct(a, b),
      list: list.map(it => ({
        name: it.name,
        rem: fmtYen(it.budget.year - it.actual.year),
        pct: pct(it.actual.year, it.budget.year),
        warn: it.budget.year > 0 && it.actual.year > it.budget.year,
      })),
    });
  }
  return { category, cycles };
}

Object.assign(window.HM, {
  buildMonthGroups, buildWeekGroups, buildYearGroups, buildSeasonGroups,
  currentSeason, buildInsight, buildItemLens, groupByCategory,
});
</script>

<script type="text/babel" data-presets="react">
function WireframeB({ rows }) {
  const HM = window.HM;

  const categories = React.useMemo(() => {
    const seen = new Set();

    rows.forEach(r => { if (!seen.has(r.category)) { seen.add(r.category); list.push(r.category); }});
    return list;
  }, [rows]);

  const [item, setItem] = React.useState(categories[0] || '');
  const [cycleIdx, setCycleIdx] = React.useState(0);

    if (!categories.includes(item)) setItem(categories[0] || '');
  }, [categories, item]);

  const lens = React.useMemo(
    () => item ? HM.buildItemLens(rows, item) : null,
    [rows, item]
  );

  if (!lens || !lens.cycles.length) {
    return (
      <div className="view" style={{ padding: 20 }}>
        <window.EmptyMsg label="表示できるデータがありません" />

    );

  const safeIdx = Math.min(cycleIdx, lens.cycles.length - 1);

      <div style={{ padding: '16px 18px 0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

        {spark.map((v, i) => (
          <rect key={i} x={i * (100/spark.length) + 1} y={22 - (v / max) * 18}
                width={Math.max(2, 100/spark.length - 2)} height={(v / max) * 18} fill="var(--ink)" />
        ))}
      </svg>
      <div className="bar-track" style={{ height: 5, marginTop: 4 }}>
        <div className="bar-fill" style={{ width: Math.min(100, pct||0) + '%', background: warn ? 'var(--accent)' : 'var(--ink)' }} />
      </div>
    </div>
  );
}

function WireframeD({ rows }) {
  const HM = window.HM;
  const { CategoryEmoji } = window.HMC;
  const t = HM.todayInfo();

  const monthGroups = React.useMemo(() => HM.buildMonthGroups(rows), [rows]);
  const yearGroups  = React.useMemo(() => HM.buildYearGroups(rows),  [rows]);
  const season = HM.currentSeason();
  const seasonGroups = React.useMemo(() => HM.buildSeasonGroups(rows, season), [rows, season]);
  const insight = HM.buildInsight(monthGroups);

  let totalBudget = 0, totalActual = 0;
  monthGroups.forEach(g => { totalBudget += g.budget; totalActual += g.actual; });
  const totalRemain = totalBudget - totalActual;
  const totalPct = HM.pct(totalActual, totalBudget);

  const top4 = monthGroups.slice().sort((a,b) => b.budget - a.budget).slice(0, 4);
  function sparkFor(category) {
    const items = rows.filter(r => r.category === category && r.cycles.month);
    const arr = Array(t.month).fill(0);
    items.forEach(it => {
      for (let i = 0; i < t.month; i++) arr[i] += it.monthly[i] || 0;
    });
    return arr.length ? arr : [0];
  }

  let yBudget = 0, yActual = 0, yRemain = 0;
  yearGroups.forEach(g => { yBudget += g.budget; yActual += g.actual; yRemain += g.remain; });

  return (
    <div className="view">
      <div style={{ padding: '16px 18px 10px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 }}>
        <div>
          <div className="handwriting" style={{ fontSize: 22, fontWeight: 600 }}>残りいくら</div>
          <div className="mono" style={{ fontSize: 10, color: 'var(--ink-faint)' }}>{t.label} · 月末まで{t.monthDaysLeft}日</div>
        </div>
      </div>

      <div style={{ padding: '0 18px 10px' }}>
        <div className="insight-box">
          <span className="accent" style={{ marginRight: 4 }}>⇄</span>{insight}
        </div>
      </div>

      <div style={{ padding: '0 18px 10px' }}>
        <div className="sketch-box" style={{ padding: 16, background: 'var(--paper-warm)' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between' }}>
            <div className="handwriting" style={{ fontSize: 12, color: 'var(--ink-soft)' }}>{t.monthLabel} カテゴリ合計</div>
            <div className="mono" style={{ fontSize: 10, color: 'var(--ink-faint)' }}>残{Math.max(0, 100 - totalPct)}%</div>
          </div>
          <div className="big-num" style={{ fontSize: 32, marginTop: 4 }}>{HM.fmtYen(totalRemain)}</div>
          <div className="mono" style={{ fontSize: 10, color: 'var(--ink-faint)', marginBottom: 10 }}>/ {HM.fmtYen(totalBudget)}</div>
          <div className="bar-track" style={{ height: 12 }}>
            <div className="bar-fill diagonal" style={{ width: Math.min(100, totalPct) + '%' }} />
          </div>
        </div>
      </div>

      {top4.length > 0 && (
        <div style={{ padding: '0 18px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
          {top4.map(g => (
            <MiniCard
              key={g.category}
              label={g.category}
              period={t.monthLabel}
              rem={g.total}
              pct={g.pct}
              warn={g.warn}
              spark={sparkFor(g.category)}
            />
          ))}
        </div>
      )}

      {seasonGroups.length > 0 && (
        <div style={{ padding: '12px 18px 4px' }}>
          <div className="sketch-box" style={{ padding: 12 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8 }}>
              <div className="handwriting" style={{ fontSize: 13, fontWeight: 600 }}>
                {season === 'summer' ? '夏' : '冬'}シーズン合計
              </div>
              <div className="big-num" style={{ fontSize: 14 }}>
                {HM.fmtYen(seasonGroups.reduce((s,g)=>s+(g.remain||0),0))}
              </div>
            </div>
            {seasonGroups.map(g => (
              <div key={g.category} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '3px 0' }}>
                <div className="handwriting" style={{ width: 100, fontSize: 12 }}>
                  <CategoryEmoji category={g.category} />{g.category}
                </div>
                <div style={{ flex: 1, height: 7, background: 'var(--paper-warm)', border: '1px solid var(--ink-faint)', borderRadius: 3, overflow: 'hidden' }}>
                  <div style={{ width: Math.min(100, g.pct) + '%', height: '100%', background: 'var(--ink)' }} />
                </div>
                <div className="mono" style={{ fontSize: 10, width: 78, textAlign: 'right' }}>{g.total}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {yBudget > 0 && (
        <div style={{ padding: '12px 18px 4px' }}>
          <div className="mono" style={{ fontSize: 11, color: 'var(--ink-faint)', marginBottom: 6 }}>{t.year}年 · 年合計</div>
          <div className="bar-track" style={{ height: 12 }}>
            <div className="bar-fill" style={{ width: Math.min(100, HM.pct(yActual, yBudget)) + '%' }} />
          </div>
          <div className="mono" style={{ display: 'flex', justifyContent: 'space-between', marginTop: 4, fontSize: 10 }}>
            <span>残 {HM.fmtYen(yRemain)}</span><span style={{ color: 'var(--ink-faint)' }}>あと{12 - t.month}か月</span>
          </div>
        </div>
      )}
    </div>
  );
}
window.WireframeD = WireframeD;
</script>

<!-- ============================================================
     AppShell + ローディング・エラー画面
     ============================================================ -->
<script type="text/babel" data-presets="react">
function LoadingScreen() {
  return (
    <div className="fullscreen-state">
      <div className="state-card">
        <div className="spinner" />
        <div className="title">読み込み中…</div>
        <div className="body">スプレッドシートから残り予算を取得しています</div>
      </div>
    </div>
  );
}

function ErrorScreen({ message, onRetry }) {
  return (
    <div className="fullscreen-state">
      <div className="state-card">
        <div className="title" style={{ color: 'var(--accent)' }}>データを読み込めませんでした。</div>
        <div className="body">
          スプレッドシートの共有設定を確認してください。<br />
          （リンクを知っている全員が「閲覧者」以上）
        </div>
        {message && (
          <div className="url" style={{ borderColor: 'var(--accent)', color: 'var(--accent)' }}>{message}</div>
        )}
        <div className="url">{window.CSV_URL}</div>
        <button className="retry-btn" onClick={onRetry}>再読み込み</button>
      </div>
    </div>
  );
}

function App() {
  const [state, setState] = React.useState({ status: 'loading', rows: null, error: null });
  const [view, setView] = React.useState('cycle');

  const load = React.useCallback(async () => {
    setState({ status: 'loading', rows: null, error: null });
    try {
      const result = await window.HM.loadSheet();
      const rows = result.rows;
      if (!rows.length) throw new Error('データ行がありません');
      setState({ status: 'ready', rows, error: null });
    } catch (e) {
      console.error(e);
      setState({ status: 'error', rows: null, error: e && e.message ? e.message : String(e) });
    }
  }, []);

  React.useEffect(() => { load(); }, [load]);
  React.useEffect(() => { window.scrollTo({ top: 0 }); }, [view]);

  if (state.status === 'loading') return <LoadingScreen />;
  if (state.status === 'error')   return <ErrorScreen message={state.error} onRetry={load} />;

  const VIEWS = [
    { key: 'cycle',     label: 'サイクル', comp: window.WireframeA, icon: '🗓' },
    { key: 'item',      label: '品目',     comp: window.WireframeB, icon: '🔍' },
    { key: 'note',      label: 'ノート',   comp: window.WireframeC, icon: '📓' },
    { key: 'dashboard', label: 'ダッシュ', comp: window.WireframeD, icon: '▦' },
  ];
  const Active = VIEWS.find(v => v.key === view).comp;

  return (
    <div className="app-root">
      <Active rows={state.rows} />
      <div className="tabbar" role="tablist">
        {VIEWS.map(v => (
          <div key={v.key}
               role="tab"
               aria-selected={view === v.key}
               className={'tabbar-item' + (view === v.key ? ' active' : '')}
               onClick={() => setView(v.key)}>
            <div className="tabbar-icon">{v.icon}</div>
            <div className="tabbar-label">{v.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
