<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#2a3447" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="format-detection" content="telephone=no" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>

<style>
/* ============================================================
   Sketchy wireframe — Navy palette (固定)
   ============================================================ */
:root {
  --ink: #2a3447;
  --ink-soft: #5d6577;
  --ink-faint: #9aa1ad;
  --paper: #fafaf6;
  --paper-warm: #f1eee4;
  --line: #d8d4c8;
  --accent: oklch(0.62 0.13 45);
  --accent-2: oklch(0.55 0.10 240);

  --font-hand: 'Klee One', sans-serif;
  --font-hand-jp: 'Yomogi', 'Klee One', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tabbar-h: 68px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
html { background: var(--paper); }
body {
  background: var(--paper);
  font-family: var(--font-hand);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: contain;
}

/* iOS overscroll bounce背景の継続 */
body::before {
  content: ""; position: fixed; inset: 0;
  background: var(--paper); z-index: -1;
}

#root { width: 100%; min-height: 100vh; }

/* App container — フルスクリーン */
.app-root {
  position: relative;
  width: 100%;
  min-height: 100vh;
  background: var(--paper);
  padding-top: var(--safe-top);
  padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 16px);
}

/* スクロール領域 */
.view {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  background: var(--paper);
}

/* ============================================================
   原Stylesheet移植
   ============================================================ */
.sketch-box { border: 1.5px solid var(--ink); border-radius: 6px; background: var(--paper); position: relative; }
.sketch-box.dashed { border-style: dashed; border-width: 1.2px; }

.handwriting { font-family: var(--font-hand-jp); }
.mono { font-family: var(--font-mono); }

.bar-track { height: 14px; background: var(--paper-warm); border: 1.2px solid var(--ink); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--ink); }
.bar-fill.diagonal {
  background: repeating-linear-gradient(45deg, var(--ink) 0, var(--ink) 3px, var(--ink-soft) 3px, var(--ink-soft) 6px);
}
.bar-fill.light { background: var(--ink-faint); }
.bar-fill.accent { background: var(--accent); }

.notebook-bg {
  background-image:
    linear-gradient(to right, rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,0.04) 1px, transparent 1px);
  background-size: 22px 22px;
}

.chip {
  display: inline-flex; align-items: center;
  padding: 4px 12px; border: 1px solid var(--ink); border-radius: 999px;
  font-size: 12px; background: var(--paper); font-family: var(--font-hand-jp);
  cursor: pointer; user-select: none; flex-shrink: 0;
}
.chip.active { background: var(--ink); color: var(--paper); }

.tab-row { display: flex; gap: 6px; border-bottom: 1.2px solid var(--ink); padding: 0 16px; overflow-x: auto; }
.tab {
  padding: 8px 14px 6px; font-family: var(--font-hand-jp); font-size: 14px;
  border: 1.2px solid var(--ink); border-bottom: none; border-radius: 8px 8px 0 0;
  background: var(--paper-warm); margin-bottom: -1.2px; cursor: pointer;
  flex-shrink: 0; user-select: none;
}
.tab.active { background: var(--ink); color: var(--paper); }

.section-rule { border: 0; border-top: 1px dashed var(--ink-faint); margin: 12px 16px; }
.big-num { font-family: var(--font-mono); font-weight: 500; letter-spacing: -0.02em; }

.insight-box {
  border: 1.2px dashed var(--ink-soft);
  border-radius: 8px; padding: 10px 12px;
  background: var(--paper-warm); font-family: var(--font-hand-jp);
  font-size: 12px; line-height: 1.5; color: var(--ink);
}
.insight-box .accent { color: var(--accent); font-weight: 600; }

/* スクロールバー隠し（横スクロール用） */
.no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }

/* 下部タブバー — fixed */
.tabbar {
  position: fixed;
  left: 50%;
  bottom: calc(var(--safe-bottom) + 12px);
  transform: translateX(-50%);
  width: calc(100% - 24px);
  max-width: 380px;
  display: flex;
  background: var(--paper);
  border: 1.2px solid var(--ink);
  border-radius: 999px;
  padding: 4px;
  gap: 2px;
  z-index: 100;
  box-shadow: 0 6px 18px rgba(42,52,71,0.18);
}
.tabbar-item {
  flex: 1; text-align: center; padding: 8px 4px;
  font-family: var(--font-hand-jp); font-size: 11px;
  border-radius: 999px; cursor: pointer; user-select: none;
  color: var(--ink-soft);
  transition: background 0.18s ease, color 0.18s ease;
}
.tabbar-item.active { background: var(--ink); color: var(--paper); font-weight: 600; }
.tabbar-icon { font-size: 16px; line-height: 1; }
.tabbar-label { margin-top: 3px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
function ItemRow({ name, rem, pct, warn }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '6px 0', borderTop: '1px dashed var(--line)' }}>
      <div className="handwriting" style={{ flex: 1, fontSize: 13 }}>{name}</div>
      <div style={{ width: 60, height: 5, background: 'var(--paper-warm)', border: '0.8px solid var(--ink-faint)', borderRadius: 3, overflow: 'hidden' }}>
        <div style={{ width: Math.min(100, pct) + '%', height: '100%', background: warn ? 'var(--accent)' : 'var(--ink)' }} />
      </div>
      <div className="mono" style={{ fontSize: 12, width: 72, textAlign: 'right', color: warn ? 'var(--accent)' : 'var(--ink)' }}>{rem}</div>
    </div>
  );
}

function GroupCard({ title, total, sub, pct, items, accentBg, seasonBar }) {
  return (
    <div className="sketch-box" style={{ padding: 14, background: accentBg ? 'var(--paper-warm)' : 'var(--paper)' }}>
      <div className="handwriting" style={{ fontSize: 15, fontWeight: 600 }}>{title}</div>
      <div className="big-num" style={{ fontSize: accentBg ? 28 : 22, marginTop: 4 }}>{total}</div>
      {sub && <div className="mono" style={{ fontSize: 11, color: 'var(--ink-soft)' }}>{sub}</div>}
      <div className="bar-track" style={{ height: accentBg ? 14 : 10, margin: '8px 0' }}>
        <div className="bar-fill diagonal" style={{ width: pct + '%' }} />
      </div>
      {seasonBar && <div className="handwriting" style={{ fontSize: 11, color: 'var(--accent)', fontStyle: 'italic', marginBottom: 6 }}>※ 家族間で振替して帳尻調整OK</div>}
      <div>
        {items.map(it => <ItemRow key={it.name} {...it} />)}
      </div>
    </div>
  );
}

function WireframeA() {

  return (

<!-- ============================================================

<script type="text/babel" data-presets="react">
function WireframeB() {
  const ITEMS = [
    { key: 'food',    label: '食費',      cycles: ['週','月','年'] },
    { key: 'daily',   label: '日用品',    cycles: ['月','年'] },
    { key: 'health',  label: '健康・医療',cycles: ['月','年'] },
    { key: 'beauty',  label: '衣服・美容',cycles: ['夏','冬','年'] },
    { key: 'fun',     label: 'ゆとり',    cycles: ['月','年'] },
    { key: 'special', label: '特別費',    cycles: ['年'] },
  ];
  const [item, setItem] = React.useState('food');
  const [cycleIdx, setCycleIdx] = React.useState(0);
  const def = ITEMS.find(i => i.key === item);

  const VIEWS = {
    food:    { '週': { rem: '¥51,730', sub: 'あと4日 · 1日あたり ¥12,900 ペース', used: '¥35,270', budget: '¥87,000', pct: 41, list: window.MOCK.food },
               '月': { rem: '¥80,500', sub: 'あと1日 · 月予算の進捗 35%',          used: '¥101,500', budget: '¥182,000', pct: 56, list: window.MOCK.food },
               '年': { rem: '¥656,940', sub: '年内であと約 ¥82,000 / 月のペース',  used: '¥321,290', budget: '¥978,000', pct: 33, list: window.MOCK.food } },
    daily:   { '月': { rem: '¥9,770',  sub: 'あと1日',                             used: '¥10,230', budget: '¥20,000', pct: 51, list: window.MOCK.daily },
               '年': { rem: '¥161,650', sub: '年内であと約 ¥20,200 / 月',          used: '¥86,750', budget: '¥248,400', pct: 35, list: window.MOCK.daily } },
    health:  { '月': { rem: '¥1,800', sub: 'シホは超過中', used: '¥6,200', budget: '¥8,000', pct: 78, list: window.MOCK.health },
               '年': { rem: '¥77,350', sub: '検診・鍼灸込み', used: '¥18,650', budget: '¥96,000', pct: 19, list: window.MOCK.health } },
    beauty:  { '夏': { rem: '¥82,935', sub: 'マイは振替で他から補填', used: '¥101,065', budget: '¥184,000', pct: 55, list: window.MOCK.family },
               '冬': { rem: '¥152,000', sub: '冬シーズンはこれから', used: '¥0', budget: '¥152,000', pct: 0, list: window.MOCK.family },
               '年': { rem: '¥633,210', sub: '美容含めた年合計', used: '¥190,790', budget: '¥824,000', pct: 23, list: window.MOCK.beauty } },
    fun:     { '月': { rem: '¥29,700', sub: '余裕のある月', used: '¥9,800', budget: '¥39,500', pct: 24, list: window.MOCK.fun },
               '年': { rem: '¥288,221', sub: 'ごちそう＋デート＋レジャー', used: '¥67,779', budget: '¥356,000', pct: 19, list: window.MOCK.fun } },
    special: { '年': { rem: '¥257,147', sub: '家電が想定外に進行', used: '¥271,853', budget: '¥529,000', pct: 51, list: [{ name: '家電', rem: '−¥93,053', pct: 100, warn: true }, { name: '家具', rem: '¥340,000', pct: 0 }, { name: 'メンテ', rem: '¥10,200', pct: 59 }] } },
  };

  const cycleLabel = def.cycles[cycleIdx] || def.cycles[0];
  const v = VIEWS[item][cycleLabel];

  return (
    <div className="view">
      <div style={{ padding: '16px 18px 0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div className="mono" style={{ fontSize: 11, color: 'var(--ink-faint)' }}>残りいくら · 品目レンズ</div>
        <div className="handwriting" style={{ fontSize: 11, color: 'var(--ink-soft)' }}>4月29日</div>
      </div>

      <div className="no-scrollbar" style={{ padding: '14px 18px 6px', display: 'flex', gap: 6, overflowX: 'auto' }}>
        {ITEMS.map(i => (
          <div key={i.key} className={'chip' + (item === i.key ? ' active' : '')}
               onClick={() => { setItem(i.key); setCycleIdx(0); }}>{i.label}</div>
        ))}
      </div>

      <div style={{ padding: '4px 18px 10px', display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
        <div className="mono" style={{ fontSize: 10, color: 'var(--ink-faint)' }}>サイクル</div>
        {def.cycles.map((c, i) => (
          <div key={c} className={'chip' + (i === cycleIdx ? ' active' : '')}
               style={{ fontSize: 11, padding: '3px 10px' }} onClick={() => setCycleIdx(i)}>{c}</div>
        ))}
      </div>

      <div style={{ padding: '4px 22px 14px' }}>
        <div className="handwriting" style={{ fontSize: 13, color: 'var(--ink-soft)' }}>

        <div className="big-num" style={{ fontSize: 44, fontWeight: 500, lineHeight: 1.05, marginTop: 6 }}>{v.rem}</div>
        <div className="handwriting" style={{ fontSize: 12, color: 'var(--ink-soft)', marginTop: 6 }}>{v.sub}</div>
      </div>

        <div className="bar-track" style={{ height: 16 }}>
          <div className="bar-fill diagonal" style={{ width: v.pct + '%' }} />
        </div>

          <span>使った {v.used}</span><span>予算 {v.budget}</span>
        </div>
      </div>

      <hr className="section-rule" />

      <div style={{ padding: '0 22px' }}>
        <div className="mono" style={{ fontSize: 11, color: 'var(--ink-faint)', marginBottom: 6 }}>内訳</div>

          <div key={r.name} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '6px 0' }}>
            <div className="handwriting" style={{ width: 110, fontSize: 13 }}>{r.name}</div>
            <div style={{ flex: 1, height: 7, background: 'var(--paper-warm)', border: '1px solid var(--ink-faint)', borderRadius: 4, overflow: 'hidden' }}>
              <div style={{ width: Math.min(100, r.pct) + '%', height: '100%', background: r.warn ? 'var(--accent)' : 'var(--ink)' }} />
            </div>
            <div className="mono" style={{ width: 72, textAlign: 'right', fontSize: 12, color: r.warn ? 'var(--accent)' : 'var(--ink)' }}>{r.rem}</div>
          </div>
        ))}
      </div>

      <hr className="section-rule" />

      <div style={{ padding: '0 22px 16px' }}>
        <div className="mono" style={{ fontSize: 11, color: 'var(--ink-faint)', marginBottom: 6 }}>今月の一言</div>
        <div className="insight-box">
          <span className="accent" style={{ marginRight: 4 }}>⇄</span>{window.MOCK.insight}
        </div>
      </div>
    </div>
  );
}
window.WireframeB = WireframeB;
</script>

<script type="text/babel" data-presets="react">
function Highlight({ title, value, sub }) {
  return (
    <div className="sketch-box" style={{ minWidth: 160, padding: 12, background: 'var(--paper-warm)', flexShrink: 0 }}>
      <div className="handwriting" style={{ fontSize: 11, color: 'var(--ink-soft)', minHeight: 28 }}>{title}</div>
      <div className="big-num" style={{ fontSize: 18, marginTop: 4 }}>{value}</div>
      <div className="mono" style={{ fontSize: 10, color: 'var(--ink-faint)' }}>{sub}</div>
    </div>
  );
}

function Section({ cycle, period, children }) {
  return (
    <div>
      <div style={{ padding: '12px 22px 6px', display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', borderTop: '1.2px solid var(--ink)', marginTop: 8, background: 'var(--paper)' }}>
        <div className="handwriting" style={{ fontSize: 13, fontWeight: 600 }}>▸ {cycle}</div>
        <div className="mono" style={{ fontSize: 11, color: 'var(--ink-faint)' }}>{period}</div>

<script type="text/babel" data-presets="react">
function AppShell() {
  const [view, setView] = React.useState('cycle');
  const VIEWS = [
    { key: 'cycle',     label: 'サイクル', comp: window.WireframeA, icon: '🗓' },
    { key: 'item',      label: '品目',     comp: window.WireframeB, icon: '🔍' },
    { key: 'note',      label: 'ノート',   comp: window.WireframeC, icon: '📓' },
    { key: 'dashboard', label: 'ダッシュ', comp: window.WireframeD, icon: '▦' },
  ];
  const Active = VIEWS.find(v => v.key === view).comp;

  // ビュー切替時に上にスクロール
  React.useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }, [view]);

  return (
    <div className="app-root">
      <Active />
      <div className="tabbar" role="tablist">
        {VIEWS.map(v => (
          <div key={v.key}
               role="tab"
               aria-selected={view === v.key}
               className={'tabbar-item' + (view === v.key ? ' active' : '')}
               onClick={() => setView(v.key)}>
            <div className="tabbar-icon">{v.icon}</div>
            <div className="tabbar-label">{v.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppShell />);
</script>
